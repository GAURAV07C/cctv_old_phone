# Personal SmartCam Coturn configuration
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=smartcam.local
server-name=smartcam-turn
user=smartcam:ChangeThisTurnPassword
stale-nonce=600
no-cli
no-multicast-peers
no-loopback-peers
min-port=49160
max-port=49200
log-file=stdout
simple-log

# For internet access, set this to your public IP and LAN IP, for example:
# external-ip=YOUR_PUBLIC_IP/192.168.1.7
